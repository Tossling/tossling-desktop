name: Windows and Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["jvm/**", ".github/workflows/jvm.yml", "VERSION"]
  pull_request:
    paths: ["jvm/**", ".github/workflows/jvm.yml", "VERSION"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :protocol:test :app:test --console=plain

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        working-directory: jvm
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:test :app:windowsRelease --console=plain
      - if: env.SIGN != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: jvm/app/build/release/Tossling-*.msi
          archive: false
          if-no-files-found: error
      - if: env.SIGN == 'true'
        run: |
          mkdir -p app/build/unsigned
          mv app/build/release/Tossling-*.msi "app/build/unsigned/Tossling-$(cat ../VERSION)-unsigned.msi"
      - if: env.SIGN == 'true'
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          path: jvm/app/build/unsigned/Tossling-*-unsigned.msi
          archive: false
          if-no-files-found: error
      - if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tossling-desktop
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: jvm/app/build/signed
          skip-decompress: true
      - if: env.SIGN == 'true'
        run: mv app/build/signed/*.msi "app/build/release/Tossling-$(cat ../VERSION).msi"
      - if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: jvm/app/build/release/Tossling-*.msi
          archive: false
          if-no-files-found: error
