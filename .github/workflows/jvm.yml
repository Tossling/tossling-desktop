name: Windows and Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["jvm/**", ".github/workflows/jvm.yml", "VERSION"]
  pull_request:
    paths: ["jvm/**", ".github/workflows/jvm.yml", "VERSION"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :protocol:test :app:test --console=plain

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:test :app:windowsRelease --console=plain
      - uses: actions/upload-artifact@v7
        with:
          path: jvm/app/build/release/Tossling-*.msi
          archive: false
          if-no-files-found: error
